<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<meta name="description" content="Uchar Gilam - The Flying Carpet. A story game adapted from an Uzbek folk tale.">
<title>Uchar Gilam — The Flying Carpet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=El+Messiri:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0a1a; overflow: hidden; overscroll-behavior: none; }
  body { font-family: Alegreya, "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; color: #f6ecd8;
         -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  /* The stage always has a real size (the whole window), so the canvas can
     never collapse to nothing while the game is still measuring its parent. */
  #game-container { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 40%, #1b1740 0%, #0b0a1a 70%); }
  #game-container canvas { display: block; touch-action: none; outline: none; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          pointer-events: none; transition: opacity .5s ease; z-index: 2; }
  #boot .t { font-family: "El Messiri", "Palatino Linotype", Georgia, serif; font-size: clamp(22px, 4vw, 44px); letter-spacing: .14em; color: #f4d58a; }
  #boot .s { font-style: italic; font-size: clamp(13px, 1.6vw, 18px); color: #b9a98a; }
  #boot .bar { width: min(280px, 50vw); height: 3px; background: #2a2550; border-radius: 2px; overflow: hidden; }
  #boot .bar i { display: block; width: 40%; height: 100%; background: #d9a441; border-radius: 2px; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { transform: translateX(-60%); } to { transform: translateX(210%); } }
  #boot.gone { opacity: 0; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 32px;
            background: #0b0a1a; z-index: 5; font-size: 20px; line-height: 1.5; color: #f4d58a; }
  @media (orientation: portrait) and (max-width: 720px) { #rotate { display: flex; } }
  noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 9; background: #0b0a1a; }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="boot"><div class="t">UCHAR GILAM</div><div class="s">unrolling the carpet&hellip;</div><div class="bar"><i></i></div></div>
<div id="rotate">Turn your phone sideways<br>to ride the carpet.</div>
<noscript>This game needs JavaScript to run.</noscript>

<script src="phaser.min.js"></script>
<script src="src/core.js"></script>
<script src="src/data.js"></script>
<script src="src/audio.js"></script>
<script src="src/paint.js"></script>
<script src="src/art-people.js"></script>
<script src="src/art-world.js"></script>
<script src="src/art-props.js"></script>
<script src="src/ui.js"></script>
<script src="src/Walk.js"></script>
<script src="src/SceneBookends.js"></script>
<script src="src/SceneHallOfSkulls.js"></script>
<script src="src/SceneVillagePalace.js"></script>
<script src="src/SceneCarpet.js"></script>
<script src="src/SceneTown.js"></script>
<script src="src/SceneMiniGames.js"></script>
<script src="src/SceneDuel.js"></script>
<script src="src/main.js"></script>
</body>
</html>
